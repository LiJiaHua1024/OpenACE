[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openace"
version = "0.1.0"
description = "Local-first open virtual singer workstation with MCP-native automation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "OpenACE contributors"}]
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "numpy>=1.24",
  "soundfile>=0.12.1",
  "mido>=1.3",
  "PyYAML>=6.0",
  "pypinyin>=0.50",
  "cmudict>=1.0",
  "huggingface-hub>=0.23",
  "httpx>=0.27",
  "matplotlib>=3.8",
  "mcp>=1.2,<2",
]

[project.optional-dependencies]
audio = ["librosa>=0.10", "pyloudnorm>=0.1.1", "faster-whisper>=1.0"]
gpu = ["torch>=2.2", "torchaudio>=2.2", "librosa>=0.10", "pyloudnorm>=0.1.1", "faster-whisper>=1.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4", "playwright>=1.43"]

[project.scripts]
openace-tool = "openace.cli:main"
openace-mcp = "openace.mcp_server:main"
openace-server = "openace.server.app:run"

[tool.hatch.build.targets.wheel]
packages = ["openace"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
